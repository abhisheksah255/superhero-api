name: Superhero API Tests

on:
  push:
    branches: [ "main","patch-1" ]
  pull_request:
    branches: [ "main","patch-1" ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Newman (Postman CLI)
        run: npm install -g newman newman-reporter-html newman-reporter-junitfull

      - name: Run API Tests with Newman
        run: |
          newman run superhero-api.postman_collection.json \
            --reporters cli,junit,html \
            --reporter-junit-export newman-report.xml \
            --reporter-html-export newman-report.html || true

      - name: Upload JUnit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: newman-report.xml

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: newman-report.html

      - name: Add Test Summary to Workflow
        run: |
          echo "### 🦸 Superhero API Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ API tests executed" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Detailed report attached as artifacts" >> $GITHUB_STEP_SUMMARY
